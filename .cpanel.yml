# HIRFAH cPanel Git deployment - stage 2.1: preflight checks only.
# Runs deploy/cpanel-deploy.sh, which only reads and appends to storage/deploy/preflight.log
# (ignored by /storage/deploy/*.log). It copies nothing to public_html, runs no Composer, npm, migrations,
# seeders or cache commands, changes no .env, database, file or permission, deletes nothing and uses no network.
# A failed check exits non-zero, so the deployment fails with the reason in the log.
deployment:
  tasks:
    - /bin/bash /home/hirfahpal/hirfah-app/deploy/cpanel-deploy.sh
